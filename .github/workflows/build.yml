name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfuse2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/RetroClock | Out-Null
          Copy-Item build/Release/RetroClock.exe dist/RetroClock/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/RetroClock/RetroClock.exe
          Compress-Archive -Path dist/RetroClock -DestinationPath RetroClock-${{ matrix.name }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/RetroClock.app -dmg
          mv build/RetroClock.dmg RetroClock-${{ matrix.name }}.dmg

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          DESTDIR=AppDir cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE=$(which qmake6 || which qmake)
          export EXTRA_PLATFORM_PLUGINS=libqwayland-generic.so
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv RetroClock*.AppImage RetroClock-${{ matrix.name }}.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroClock-${{ matrix.name }}
          path: RetroClock-${{ matrix.name }}.*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RetroClock-${{ matrix.name }}.*
